<?xml version="1.0" encoding="UTF-8"?> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2334 1110" role="img" aria-labelledby="hitz-logo-title hitz-logo-desc"><title id="hitz-logo-title">HITZ — основной логотип</title><desc id="hitz-logo-desc"> Шрифтовой логотип агентства HITZ, первого GEO (AI SEO) агентства Центральной Азии. Строчное начертание hitz: соединительная горизонтальная полоса на x-height, через которую проходят все элементы — высокая ножка h, ствол i, ствол t и заворот z с курсивной пяткой и внутренним «глазом». Точка над i — отдельная квадратная плашка с зазором от полосы. Используется на тёмном фоне (ink #232323). </desc><g id="hitz-wordmark" fill="#ffffff"><path id="hitz-letterforms" d="M 30 30 C 104.9 30 179.8 30 257 30 C 257 114.8 257 199.6 257 287 C 573.5 287 889.9 287 1216 287 C 1216 202.2 1216 117.4 1216 30 C 1291.2 30 1366.5 30 1444 30 C 1444 114.8 1444 199.6 1444 287 C 1728.1 287 2012.3 287 2305 287 C 2305 483 2305 483 2291 498 C 2287.3 502.2 2287.3 502.2 2285.8 504 C 2283.4 506.7 2280.9 509.4 2278.5 512 C 2275.5 515.3 2272.4 518.6 2269.5 522 C 2266.1 525.9 2262.6 529.8 2259.1 533.6 C 2256.5 536.4 2254 539.1 2251.5 542 C 2248.1 545.9 2244.6 549.8 2241.1 553.6 C 2238.5 556.4 2236 559.1 2233.5 562 C 2230.1 565.9 2226.6 569.8 2223.1 573.6 C 2220.5 576.4 2218 579.1 2215.5 582 C 2212.1 585.9 2208.6 589.8 2205.1 593.6 C 2202.5 596.4 2200 599.1 2197.5 602 C 2194.1 605.9 2190.6 609.8 2187.1 613.6 C 2184.5 616.4 2182 619.1 2179.5 622 C 2176.1 625.9 2172.6 629.8 2169.1 633.6 C 2166.5 636.4 2164 639.1 2161.5 642 C 2158.1 645.9 2154.6 649.8 2151.1 653.6 C 2148.5 656.4 2146 659.1 2143.5 662 C 2140.1 665.9 2136.6 669.8 2133.1 673.6 C 2130.5 676.4 2128 679.1 2125.5 682 C 2122.1 685.9 2118.6 689.8 2115.1 693.6 C 2112.5 696.4 2110 699.1 2107.5 702 C 2104.1 705.9 2100.6 709.8 2097.1 713.6 C 2094.5 716.4 2092 719.1 2089.5 722 C 2086.1 725.9 2082.6 729.8 2079.1 733.6 C 2076.5 736.4 2074 739.1 2071.5 742 C 2068.1 745.9 2064.6 749.8 2061.1 753.6 C 2058.5 756.4 2